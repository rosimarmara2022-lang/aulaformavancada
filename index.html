<!DOCTYPE html>
<html lang="pt-BR"
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários Avançados</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <h2>Formulário Avançado</h2>

   <form>
    <label>Nome Completo: </label>
    <input type="text" id="nome" required minlength="3" maxlength>

    <fieldset>
        <legend>Escolha o turno de atendimento: </legend>
        <input type="radio" id="manha" name="turno" value="manha" required>
        <label>Manhã</label>

        <input type="radio" id="tarde" name="turno" value="tarde" required>
        <label>Tarde</label>
     </fieldset>
    <button type="submit">Salvar</button>
   </form> 
   </body>
   </html>
